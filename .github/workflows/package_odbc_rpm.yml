name: Package Apache Arrow Flight SQL ODBC RPM

# Builds the Apache Arrow RPM packages from
# dev/tasks/linux-packages/apache-arrow/yum/arrow.spec.in for AlmaLinux 9 and
# 10 on amd64 and arm64, then installs them in a clean container and verifies
# that the Flight SQL ODBC driver is registered with unixODBC. Only the Flight
# SQL ODBC RPM is uploaded as an artifact. rpmbuild always builds every package
# of the spec, so the other RPMs are only used by the verification step.
on:
  # TEMP: remove before upstreaming.
  push:
    branches:
      - rpm-odbc-ci
  workflow_dispatch:

# TODO: -AL- check and simplify changes. Remove all checks that are not necessary.

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  package:
    name: AlmaLinux ${{ matrix.almalinux }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        almalinux:
          - "9"
          - "10"
        architecture:
          - amd64
          - arm64
    env:
      BUILD_DIR: "${{ github.workspace }}/packages.build"
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Resolve target
        env:
          ALMALINUX_VERSION: ${{ matrix.almalinux }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -eu

          yum_dir=dev/tasks/linux-packages/apache-arrow/yum

          # Example: 9 -> almalinux-9
          target="almalinux-${ALMALINUX_VERSION}"
          if [ ! -f "${yum_dir}/${target}/Dockerfile" ]; then
            echo "No RPM build target '${target}'. Available targets:"
            ls "${yum_dir}" | grep -E '^almalinux-'
            exit 1
          fi

          # The image the RPMs are tested on. It is a multi-arch tag, so an
          # arm64 runner pulls the arm64 image.
          # Example: ARG FROM=almalinux:9 -> almalinux:9
          image="$(sed -n 's/^ARG FROM=//p' "${yum_dir}/${target}/Dockerfile")"

          if [ "${ARCHITECTURE}" = "arm64" ]; then
            # The arm64 target has no Dockerfile of its own. It only has a
            # `from` file with the arm64 base image and is built from the
            # Dockerfile above.
            target="${target}-aarch64"
            if [ ! -f "${yum_dir}/${target}/from" ]; then
              echo "No RPM build target '${target}'. Available targets:"
              ls "${yum_dir}" | grep -E '^almalinux-'
              exit 1
            fi
          fi

          {
            echo "DISTRIBUTION=almalinux"
            echo "DISTRIBUTION_VERSION=${ALMALINUX_VERSION}"
            echo "YUM_TARGETS=${target}"
            echo "TARGET=${target}"
            echo "TEST_IMAGE=${image}"
          } >> "${GITHUB_ENV}"
      - name: Free up disk space
        run: |
          ci/scripts/util_free_space.sh
      - name: Restore ccache
        uses: apache/infrastructure-actions/stash/restore@d3a005f07dd94a34d11361b0287b0c1fdc6d55f5
        with:
          path: ${{ env.BUILD_DIR }}/${{ env.TARGET }}
          key: package-odbc-rpm-${{ env.TARGET }}
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            rake \
            ruby \
            ruby-dev
      - name: Update version
        run: |
          rake -C dev/tasks/linux-packages/apache-arrow version:update
      - name: Build RPMs
        run: |
          rake -C dev/tasks/linux-packages/apache-arrow yum:build
      - name: Save ccache
        if: >-
          !cancelled()
        continue-on-error: true
        uses: apache/infrastructure-actions/stash/save@d3a005f07dd94a34d11361b0287b0c1fdc6d55f5
        with:
          path: ${{ env.BUILD_DIR }}/${{ env.TARGET }}
          key: package-odbc-rpm-${{ env.TARGET }}
          include-hidden-files: true
      - name: Collect RPMs
        run: |
          set -eux
          mkdir rpms odbc-rpm
          find "dev/tasks/linux-packages/apache-arrow/yum/repositories/${DISTRIBUTION}/${DISTRIBUTION_VERSION}" \
            -name '*.rpm' \
            -not -name '*.src.rpm' \
            -exec cp -a {} rpms/ \;
          ls -l rpms
          # Only the ODBC driver package. The digit after "libs-" excludes
          # the -debuginfo package.
          cp -a rpms/*flight-sql-odbc-libs-[0-9]*.rpm odbc-rpm/
          ls -l odbc-rpm
          test "$(ls odbc-rpm | wc -l)" -eq 1
      - name: Upload ODBC RPM to the job
        uses: actions/upload-artifact@v7
        with:
          name: flight-sql-odbc-rpm-${{ env.TARGET }}
          path: odbc-rpm/*.rpm
          if-no-files-found: error
      - name: Install ODBC RPM and verify driver registration
        run: |
          docker run \
            --rm \
            --volume "${PWD}/rpms:/rpms:ro" \
            "${TEST_IMAGE}" \
            bash -ceu '
              dnf install -y epel-release
              dnf install -y --enablerepo=crb --enablerepo=epel \
                $(ls /rpms/*-libs-*.rpm | grep -v -E "debuginfo|debugsource")
              rpm -qa "*flight-sql-odbc-libs*"

              driver_name="Apache Arrow Flight SQL ODBC Driver"
              odbcinst -q -d -n "${driver_name}"

              # The installed driver must exist and have all dependencies
              echo "Files in the ODBC libs package:"
              rpm -ql $(rpm -qa "*flight-sql-odbc-libs*")
              driver=$(rpm -ql $(rpm -qa "*flight-sql-odbc-libs*") |
                grep -E "/libarrow_flight_sql_odbc\.so\.[0-9]+\.[0-9]+\.[0-9]+$")
              echo "Driver library: [${driver}]"
              test -f "${driver}" || {
                echo "ERROR: driver library does not exist: [${driver}]"
                exit 1
              }
              if ldd "${driver}" | grep "not found"; then
                echo "ERROR: driver has unresolved shared library dependencies"
                exit 1
              fi
              echo "Driver library found and all dependencies resolved"
            '
